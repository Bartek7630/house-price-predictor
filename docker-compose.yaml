version: '3.8'

services:
  fastapi:
    image: bartek7630/fastapi:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - "8000:8000"
    networks:
      - app-network

  streamlit:
    image: bartek7630/streamlit:dev
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    ports: 
      - "8501:8501"
    environment:
      - API_URL=http://fastapi:8000
      - FASTAPI_URL=http://fastapi:8000/predict
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
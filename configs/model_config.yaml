model:
  name: house_price_model
  best_model: XGBoost
  target_variable: price
  r2_score: 0.85
  mae: 25000.0
  parameters:
    n_estimators: 150
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
  feature_sets:
    rfe:
      - sqft
      - bedrooms
      - bathrooms
      - year_built
      - house_age
      - price_per_sqft
      - bed_bath_ratio
      - location_encoded
      - condition
      - waterfront